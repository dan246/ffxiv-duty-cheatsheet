<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FF14 副本小抄</title>
<style>
:root {
  --bg: #0f1115;
  --bg2: #161a21;
  --bg3: #1e232c;
  --line: #2a3140;
  --fg: #e8ebf0;
  --fg2: #a9b1bf;
  --fg3: #6f7886;
  --accent: #6cb4ff;
  --accent2: #ffd166;
  --tank: #4f8cff;
  --heal: #4fcf7a;
  --dps: #ff6b6b;
  --d1: #6fbf73;
  --d2: #f0b429;
  --d3: #ff4d4f;
  --radius: 10px;
  --fs: 15px;
  --sidebar-w: 320px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
  font-size: var(--fs);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 800; letter-spacing: .5px; color: var(--fg); white-space: nowrap; font-size: 1.05em; }
.brand span { color: var(--accent); margin-left: 4px; font-weight: 600; }
.search { flex: 1; position: relative; min-width: 0; }
.search input {
  width: 100%;
  padding: 8px 34px 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  outline: none;
}
.search input:focus { border-color: var(--accent); }
.search .clear-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.topbar-actions { display: flex; gap: 6px; }
.iconbtn {
  background: transparent; border: 1px solid transparent; border-radius: 8px;
  padding: 6px 9px; color: var(--fg2); line-height: 1;
}
.iconbtn:hover { background: var(--bg3); color: var(--fg); }
.iconbtn.toggle.on { background: var(--accent); color: #0b1220; border-color: var(--accent); }
.menu-btn { display: none; font-size: 1.2em; }

/* ---------- layout ---------- */
.layout { display: flex; min-height: calc(100vh - 50px); }
.sidebar {
  width: var(--sidebar-w); flex: none;
  border-right: 1px solid var(--line);
  background: var(--bg2);
  position: sticky; top: 50px; height: calc(100vh - 50px);
  display: flex; flex-direction: column;
}
.filters { padding: 10px 12px 6px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--fg2);
  border-radius: 999px; padding: 3px 10px; font-size: .85em; line-height: 1.3;
}
.chip:hover { color: var(--fg); border-color: var(--fg3); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
.list { overflow-y: auto; flex: 1; padding: 6px 0 40px; }
.list-group { padding: 10px 14px 4px; color: var(--fg3); font-size: .78em; letter-spacing: 1px; text-transform: uppercase; position: sticky; top: 0; background: var(--bg2); }
.list-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; text-align: left;
  padding: 7px 14px; border: none; background: transparent; color: var(--fg);
}
.list-item:hover { background: var(--bg3); }
.list-item.active { background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.list-item .lv { flex: none; width: 36px; color: var(--fg3); font-size: .8em; font-variant-numeric: tabular-nums; }
.list-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .nm small { color: var(--fg3); margin-left: 6px; font-size: .8em; }
.list-item .fav { color: var(--accent2); font-size: .85em; }
.list-empty { padding: 30px 16px; color: var(--fg3); text-align: center; }

.badge {
  display: inline-block; flex: none;
  font-size: .72em; padding: 1px 6px; border-radius: 4px; line-height: 1.5;
  background: var(--bg3); color: var(--fg2); border: 1px solid var(--line);
  white-space: nowrap;
}
.badge.t-dungeon { color: #9ad0ff; border-color: #2f5f8a; }
.badge.t-trial { color: #ffd88a; border-color: #8a6a2f; }
.badge.t-extreme { color: #ff9f6b; border-color: #8a4a2f; }
.badge.t-raid { color: #c9a6ff; border-color: #5f3f8a; }
.badge.t-savage { color: #ff7b9c; border-color: #8a2f4a; }
.badge.t-alliance { color: #8ae0d2; border-color: #2f8a7a; }
.badge.t-ultimate { color: #ff5c5c; border-color: #a02020; font-weight: 700; }

/* ---------- content ---------- */
.content { flex: 1; min-width: 0; padding: 20px 28px 80px; max-width: 1100px; }
.home h1 { margin: .2em 0; }
.home p { color: var(--fg2); }
.home .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
.home h3 { margin: 0 0 8px; color: var(--fg2); font-size: .95em; }
.home .stat { color: var(--fg3); font-size: .9em; margin-top: 30px; }
.home kbd { background: var(--bg3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: .9em; }
.linklist a { display: block; padding: 4px 0; }
.linklist a small { color: var(--fg3); margin-left: 6px; }

.duty-head { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
.duty-head .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--fg3); font-size: .85em; margin-bottom: 4px; }
.duty-head h1 { margin: 0; font-size: 1.7em; line-height: 1.25; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.duty-head h1 .en { font-size: .55em; color: var(--fg3); font-weight: 400; }
.duty-head .favbtn { font-size: 1.1em; }
.duty-head .favbtn.on { color: var(--accent2); }
.overview {
  background: var(--bg2); border-left: 4px solid var(--accent); border-radius: 6px;
  padding: 10px 14px; margin-bottom: 14px;
}
.route { margin-bottom: 14px; }
.route summary { cursor: pointer; color: var(--fg2); font-weight: 600; }
.route .body { white-space: pre-line; color: var(--fg2); padding: 8px 0 0 14px; }

.boss { margin: 24px 0; scroll-margin-top: 60px; }
.boss-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.boss-head .num { color: var(--accent2); font-weight: 800; font-size: .9em; }
.boss-head h2 { margin: 0; font-size: 1.3em; }
.boss-head .en { color: var(--fg3); font-size: .85em; }
.boss .summary { color: var(--fg2); margin: 0 0 10px; }

.mech {
  display: grid; grid-template-columns: 8px 1fr; gap: 0 12px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; margin-bottom: 8px;
}
.mech .bar { border-radius: 4px; background: var(--fg3); align-self: stretch; }
.mech.d1 .bar { background: var(--d1); }
.mech.d2 .bar { background: var(--d2); }
.mech.d3 .bar { background: var(--d3); }
.mech-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 700; }
.mech-title .en { color: var(--fg3); font-weight: 400; font-size: .85em; }
.mech-title .phase { color: var(--fg3); font-weight: 400; font-size: .85em; margin-left: auto; }
.role { font-size: .72em; padding: 0 6px; border-radius: 4px; font-weight: 700; line-height: 1.6; }
.role.T { background: var(--tank); color: #fff; }
.role.H { background: var(--heal); color: #052; }
.role.D { background: var(--dps); color: #fff; }
.mech .desc { color: var(--fg2); margin-top: 4px; }
.mech .solve { margin-top: 4px; }
.mech .solve::before { content: "→ "; color: var(--accent2); font-weight: 800; }
.tips { margin: 8px 0 0; padding-left: 18px; color: var(--fg2); }
.tips li { margin: 2px 0; }
.notes { margin-top: 20px; border-top: 1px dashed var(--line); padding-top: 12px; }
.notes h3 { margin: 0 0 6px; font-size: 1em; color: var(--fg2); }
.notes ul { margin: 0; padding-left: 18px; color: var(--fg2); }

.boss-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.boss-nav a { font-size: .85em; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg2); }
.boss-nav a:hover { border-color: var(--accent); color: var(--fg); }

/* compact mode */
body.compact .mech .desc { display: none; }
body.compact .boss .summary { display: none; }
body.compact .mech { padding: 6px 10px; margin-bottom: 4px; }
body.compact .tips { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .menu-btn { display: inline-block; }
  .brand span { display: none; }
  .topbar-actions #fontMinus, .topbar-actions #fontPlus { display: none; }
  .sidebar {
    position: fixed; left: 0; top: 50px; bottom: 0; height: auto; z-index: 25;
    width: min(85vw, 340px);
    transform: translateX(-100%); transition: transform .2s;
  }
  .sidebar.open { transform: none; }
  .backdrop { display: none; position: fixed; inset: 50px 0 0 0; background: rgba(0,0,0,.5); z-index: 20; }
  .backdrop.show { display: block; }
  .content { padding: 14px 14px 80px; }
  .duty-head h1 { font-size: 1.4em; }
}

</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn menu-btn" id="menuBtn" aria-label="開關副本列表">☰</button>
  <a class="brand" href="#/">FF14<span>副本小抄</span></a>
  <div class="search">
    <input id="searchInput" type="search" placeholder="搜尋副本 / Boss（中英皆可，按 / 快速輸入）" autocomplete="off" spellcheck="false">
    <button class="iconbtn clear-btn" id="clearBtn" aria-label="清除" hidden>✕</button>
  </div>
  <div class="topbar-actions">
    <button class="iconbtn" id="fontMinus" title="縮小字體">A−</button>
    <button class="iconbtn" id="fontPlus" title="放大字體">A+</button>
    <button class="iconbtn toggle" id="compactBtn" title="精簡模式：只顯示機制名與解法">精簡</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="filters">
      <div class="chips" id="typeChips"></div>
      <div class="chips" id="expChips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="content" id="content"></main>
</div>

        { name: { cn: "阿剌克涅之网（橘色点名）", en: "Web marker" }, desc: "三人橘色點名，腳下放一張蛛網，踩上會減速。", solve: "P1 隨便放；**P3 要放到場邊**，之後躲蜘蛛陷阱要用。", danger: 1 },

      mechanics: [
        { name: { cn: "站位", en: "Positioning" }, desc: "場地會掉下去（突進、後跳的職業小心）。進場的長方形平台是 B，左邊 A、右邊 C，各隊 T 站平台靠王的位置，其他人站 T 右側不重疊。", solve: "開怪前標好 ABC。", danger: 2 },
        { name: { cn: "陨石冲击（黑圈点名）", en: "Meteor Impact (spread marker)" }, desc: "每隊 1 人（後期 2 人）被紅黑大圈點名，落點會刷「压缩世界的断片」；兩顆太近會互相「岩屑爆炸」全場傷＋傷害降低，附近的隊可能直接死。", solve: "被點的人放在**自家平台右後角**或指定標點，兩顆絕不重疊；放完立刻回人群，刷出的小怪馬上殺（放著會全場 AOE）。掉下去的人會在平台後方重生放點，小心和別人撞。", danger: 3 },
        { name: { cn: "陨石（分摊）", en: "Meteor (stack)" }, desc: "隨機一人分攤標記，帶魔法易傷。", solve: "全隊集合分攤；拖太久會來第二次，全團撐不住兩次。", danger: 2 },
        { name: { cn: "三角锥形态（缩小射线）", en: "Pyramid form (Execration)" }, desc: "王變三角錐：對三個長方形平台各打一條直線，中了中毒＋计时（可康復）或縮小。之後隨機人上「出血」（會傳染周圍）。", solve: "**所有人離開自家平台到左右走廊上**，AOE 過了再回來。H 康復出血。", danger: 3 },
        { name: { cn: "加速度炸弹", en: "Acceleration Bomb" }, desc: "三角錐期間隨機人上加速度炸弹，頭上骰子倒數 3→0；歸零時還在動作（含自動攻擊）就吃大傷。", solve: "被點的人立刻收武器（Z）停手、停止移動，直到倒數結束。", danger: 3 },
        { name: { cn: "立方体形态（耀星）", en: "Cube form (Flare Star)" }, desc: "王變立方體：對整個走廊放環形 AOE（中了易傷）；接著對三隊 T 各打一條直線；走廊上出現「奥兹玛球」順時針飄；最後「神圣」全場傷＋小擊退。", solve: "**所有人立刻回自家平台貼近王**；直線來時 T 和隊友分開站、T 開減傷。球要人去撞（推薦 H 去，一人血只夠撞一顆，邊撞邊補），撞完趕快回平台以免神圣被推下去。", danger: 3 },
        { name: { cn: "黑洞（压缩世界）", en: "Black Hole (Ozmashade)" }, desc: "王讀「黑洞」把所有人吸進壓縮世界；有末日审判倒數，時間內沒殺掉奥兹玛之影就團滅。三個長條平台各有一隻「压缩世界的残响」。", solve: "和迷宮阿托莫斯一樣：**每隊至少 4 人站上自家台子**解除隔壁隊那隻的無敵，殺掉残响和刷出的小怪後跳下去集火奥兹玛之影。打完跳進場中央的門回原場地。", danger: 3, phase: "P2" },
        { name: { cn: "侵入（奥兹玛之影）", en: "Assimilation" }, desc: "之影讀「侵入」視線，看著它會上「渐渐浸蚀」，疊 4 層變「浸蚀」被关進压缩块。另有紅色點名放距離衰減。", solve: "讀條時背對；中了就一直背對到 debuff 消失。被關的人其他人打压缩块救出。紅點名的人跑到角落放。", danger: 2, phase: "P2" },
      ],
      tips: ["之後就是重複球→三角錐／立方體→黑洞的循環直到打死。"],
    },
    {
      name: { cn: "卡洛菲斯提莉", en: "Calofisteri" },
      summary: "看王哪邊頭髮變黑刀就往另一邊躲（魔发斩）；接发的紫圈別踩；透耳尖啸背對王；蓄力冲击後接魔发斩看面向。",
      mechanics: [
        { name: { cn: "魔发斩", en: "Haircut" }, desc: "王喊「我的魔发，是斩肉的刃、吸血的根！」後一側頭髮變黑色刀刃（訊息「魔发完成了变异」），砍那一側半場，中了「割伤」可康復。地板預警出得太晚。", solve: "看到哪邊頭髮變黑就往**另一側**走。MT 可以轉王讓半場都安全，但不會轉就別亂動。王盡量放場地中央，別放邊上（安全區會太小）。", danger: 3 },
        { name: { cn: "血爪 / 发梢分裂", en: "Bloodied Nail / Split End" }, desc: "普攻是正面順劈；頭髮變刀時普攻也會順劈那一側。", solve: "MT 別讓王面對人群。", role: "T", danger: 1 },
        { name: { cn: "接发（紫圈陷阱）", en: "Extension" }, desc: "讀「接发」後場上出現紫圈；踩到會冒出三倍大的陷阱（魔发束缚）把人吃掉，不及時打掉就「绞杀」死。", solve: "**不要站進紫圈**（靠近也會被拉）。有人被抓就全隊轉火打陷阱。", danger: 3 },
        { name: { cn: "魔力水晶 / 大魔力水晶", en: "Bijou / Grand Bijou" }, desc: "「卡洛菲斯提莉正在从宝石汲取力量」：刷小水晶和大水晶讀「供给动力」，每完成一次就強化下一次「魔发狂舞」全場傷。", solve: "先殺小水晶（讀得快）再殺大的。", danger: 2, phase: "P2" },
        { name: { cn: "潜地式波动炮", en: "Feint Particle Beam" }, desc: "小怪階段同時有追蹤點名。", solve: "被點的人貼邊繞場跑，別帶到人。", danger: 2, phase: "P2" },
        { name: { cn: "怨念魔发（斧 / 球）", en: "Living Locks (axe / bulb)" }, desc: "讀「接发」後出現整齊的黃色圈，圈裡冒出兩種怪髮：雙刃斧形＝月環（正下方安全）；圓球種子形＝「罪恶发团」把附近的人擊飛＋易傷。", solve: "站到斧形怪髮的正下方，遠離球形。", danger: 3, phase: "P2" },
        { name: { cn: "透耳尖啸", en: "Penetration" }, desc: "「魔发开始扎根」：場中央出現三個球形怪髮；面對王的人被吸進去（＋易傷），背對的人被擊退。", solve: "**背對王**（推薦面向門口），並調整位置讓自己被推到空曠處。", danger: 3, phase: "P2" },
        { name: { cn: "蓄力冲击", en: "Depth Charge" }, desc: "王往牆邊衝，落地馬上接一次魔发斩。", solve: "看王衝完的面向和頭髮躲；MT 提前走位拉好面向，否則變 24 人斬。", danger: 3, phase: "P2" },
        { name: { cn: "刀形怪发", en: "Blade locks" }, desc: "兩側出現刀形怪髮，從場地兩側射紅色光束穿過中央。", solve: "躲開光束線。", danger: 2, phase: "P2" },
      ],
    },
  ],
  notes: ["掉落 IL230 裝、玛哈古钱／玛哈晶石（每週）、幻卡、宠物。"],
},
{

  overview: "瑪哈之影第三本，全系列最難：死亡凝视在船上會掉下去、弗迪亚的虫洞與弱点生成、斯卡哈的影之手與圖騰、迪亚波罗斯後半的門與紅球。",
  route: "1. 死亡凝视後：兩次遇到**虚无结晶**，讀條結束前打掉否則變妖異；第二次配不瞑之眼的石化視線，背對。\n2. 弗迪亚後：路上有**究极神兵原型**（田園郡可接任務「不明飞行物」拿装甲片換裝）。小怪優先殺（原型浮游炮、亚拉戈恐慌装甲），有連線時神兵無敵；魔导激光三連直線躲；扩散射线正面別站；中場踩球分攤後貼牆躲耀星距離衰減，之後兩顆耀星站中間、攻城炮直線躲。最後三顆以太收集器打掉，讀「空间错乱」前打死（可以 LB）。\n3. 這本不需要固定分隊，但迪亚波罗斯後半只需一隊進門。",

      mechanics: [

        { name: { cn: "死亡诅咒", en: "Doomsay" }, desc: "隨機 1～2 人上「死亡宣告」，倒數完死。後半更頻繁。", solve: "H 立刻康復（詩人的光阴神的礼赞凯歌也行）。", role: "H", danger: 3 },
        { name: { cn: "虚空烈风（绿点名）", en: "Void Aero II" }, desc: "三人綠色分散點名，腳下放龍捲，走進去吃「烈风」風燒。", solve: "被點的人遠離人群放，之後別走進龍捲。", danger: 1 },
        { name: { cn: "虚空冰封（扇形）", en: "Void Blizzard II / III" }, desc: "大扇形 AOE，扇形之間有安全縫。", solve: "去兩側或扇形間的縫，中了大傷＋冻伤（可康復）。", danger: 2 },
        { name: { cn: "虚空暴风", en: "Void Aero III" }, desc: "場中央出現綠色旋風圈，判定時圈內即死、圈外的人被吹飛。", solve: "**站在旋風邊上、與船頭/船尾的紫牆垂直的位置**，確保被吹到船頭或船尾撞牆，否則掉下船。後半王會飛到一側牆邊接「黑暗电光」直線掃船，選王不在的那側牆。", danger: 3 },
        { name: { cn: "虚空冰澈 + 虚空飙风", en: "Void Blizzard IV + Void Aero IV" }, desc: "出現距離衰減標記（前半兩個、後半一個），落點掉大冰塊，緊接讀「虚空飙风」全員被吹飛。", solve: "**站到衰減落點的正對面**吃衰減傷害（如落點在左舷就去右舷），飙风時就會被吹到冰塊上擋住。想少吃傷害站遠會來不及。或算好時間開沉稳咏唱。", danger: 3 },
        { name: { cn: "虚空极死", en: "Void Death IV" }, desc: "地板上一直累積灰色方格；後半讀「虚空极死」時方格發亮，讀完站在上面的人死。地板全黑＋最後一次判定＝團滅。", solve: "看到方格亮就離開方格。", danger: 3, phase: "後半" },
        { name: { cn: "虚无元精", en: "Void Sprite" }, desc: "隨機刷兩隻小怪，扇形「暗黑波动」。", solve: "殺掉、躲扇形。", danger: 1 },
      ],

    {

      mechanics: [

        { name: { cn: "黑暗杂耍 / 小丑收割", en: "Jongleur's X / Jester's Reap" }, desc: "死刑；正面扇形。", solve: "T 減傷；非 T 別站前面。", danger: 2 },
        { name: { cn: "虫洞", en: "Wormhole" }, desc: "場邊出現幾隻藍/黃阿托莫斯，其中一隻連線一顆球或一個環。球＝近身圓形 AOE、環＝月環；但**實際 AOE 出現在「沒連線的同色阿托莫斯」**。", solve: "連環→去沒連線的同色阿托莫斯**腳下**；連球→**遠離**沒連線的同色阿托莫斯。兩隻都連球→站兩者垂直中間，別站重疊處；兩隻都連環→隨便一隻沒連線的腳下。中了疊易傷。", danger: 3 },
        { name: { cn: "弱点生成 → 烈炎流", en: "Debilitator → Flameflow" }, desc: "全員上「火属性耐性大幅降低」或「水属性耐性大幅降低」，場上出現紅/藍機關；之後「烈炎流」全場傷害，錯的機關越多越痛，錯太多團滅。", solve: "把**所有機關踩成和自己弱點相反的顏色**：怕火→全踩成藍（水）、怕水→全踩成紅（火）。遠的機關遠程負責；近戰打身位別反覆踩到。", danger: 3 },
        { name: { cn: "黑雷（分摊）", en: "Blackbolt (stack)" }, desc: "分攤標記。", solve: "集合分攤。", danger: 2 },
        { name: { cn: "黑炎", en: "Blackfire" }, desc: "多個逐漸擴大的圓形 AOE。", solve: "找圈之間的大空隙站。", danger: 2 },
        { name: { cn: "小丑阶段（弗迪亚小丑）", en: "Add phase (Ferdiad's Fools)" }, desc: "約 60% 王無敵到中央，場邊阿托莫斯從嘴裡噴出小丑（站在阿托莫斯正面會被打＋易傷）。小丑之一會放「石化眼」；「幸运小丑」＝小丑衝進場邊阿托莫斯、從中央傳出來打到路上的人；「冰瀑」腳下圈；之後「小丑的奖励」半場即死。小怪沒殺完會再來一輪。", solve: "別站阿托莫斯正面；殺小丑、石化眼背對；傳送後看半場預警躲到另一半。全死後「小丑的吉格舞」全場傷 H 補。", danger: 3, phase: "60%" },
      ],

    {
      name: { cn: "斯卡哈", en: "Scathach" },
      summary: "阴影回旋看翅膀方向躲、阴影重击別追王、影之手面對它就停、地板變紅別動、康拉拉離王、圖騰每個都要有人。",
      mechanics: [

        { name: { cn: "阴影回旋", en: "Shadespin" }, desc: "王伸出兩條翅膀（一定是前左＋後右或前右＋後左），拍打那兩個象限。", solve: "站到沒有翅膀的象限。翅膀出著時王會跳到某處放大版近身圈——**別追過去**。", danger: 3 },
        { name: { cn: "阴影直刺", en: "Shadethrust" }, desc: "隨機轉向一人放直線。", solve: "看王面向側移。", danger: 2 },
        { name: { cn: "影之脚镣（地板变红）", en: "Shadow Links" }, desc: "「影子聚集在地面」、場地變暗紅時，移動的人會被影子抓住上「影之脚镣」大幅減速＋流血。", solve: "地板變紅就**站住不動**。", danger: 2 },
        { name: { cn: "破土强袭 → 康拉", en: "Pitfall → Connla" }, desc: "距離衰減落點刷小怪康拉；康拉靠近王會連線給王增傷，放著不殺會團滅。", solve: "MT 帶王遠離落點；一個 OT 接康拉拉遠，全隊轉火殺。", danger: 3 },
        { name: { cn: "夜（追踪大饼）", en: "Nox" }, desc: "被紅黑大圈點名、身邊出現黑圈的人會被大範圍球追。", solve: "被點的人帶球往後場空曠處跑到結束，其他人避開。", danger: 3 },
        { name: { cn: "影之手", en: "Shadow Limbs" }, desc: "手形小怪連線 2 人並朝他們爬，碰到就即死。被連的人面對它（線變白）它就停下。", solve: "被連的人**面向手**站好不動，其他人趁機殺掉；手可能換連線對象。", danger: 3 },
        { name: { cn: "三十矢", en: "Thirty Arrows" }, desc: "藍色水灘出現後，從那裡放出米字型或連續的直線。", solve: "躲直線預警。", danger: 2 },
        { name: { cn: "茧（小怪阶段）", en: "Cocoon (adds)" }, desc: "50% 王進繭，刷女王小丑、玩偶奇美拉、女王爱犬（奇美拉的聲音可打斷）；同時場上出現圖騰，每個要一人踩，中央大圖騰傷害高。沒殺完小怪王出繭就團滅。", solve: "小怪全殺；**每個圖騰都要有人**（邊緣發光＝有踩到），中央的建議 T 踩。", danger: 3, phase: "50%" },

    {

      mechanics: [

        { name: { cn: "诱引", en: "Infernal Deliverance" }, desc: "三個加重區出現分攤塔，之後塔所在加重區擴大並圓爆。", solve: "每隊各站一座塔分攤，分攤完立刻離開該區。", danger: 3, phase: "P2" },

      summary: "P1 上下兩層平台，吐息炸上層、甩尾炸下層，依披风顏色站對層；P2 虚无之王單層，塔、交錯劍、雙重吐息。",
      mechanics: [

        { name: { cn: "黄昏披风／黄昏星云", en: "Cloak of Twilight / Twilight Nebula" }, desc: "各隊獲得黄昏披光（紫/光耐性）或披暗（黃/暗耐性），同隊同色；一層變光屬性、一層變暗屬性，站錯層會吃傷。", solve: "看自己 debuff 顏色，光去光層、暗去暗層。", danger: 3, phase: "P1" },
        { name: { cn: "星体核爆", en: "Starflare" }, desc: "兩層都出現兩組交錯直線。", solve: "站直線空隙。", danger: 3 },
        { name: { cn: "灾变涡旋", en: "Cataclysmic Vortex" }, desc: "頭上標記：播放（持續移動）、暫停（不動不攻擊）、眼睛（別看王）、眼睛＋問號（看王）。失敗剩 1 血。", solve: "照標記做，倒數結束前完成。", danger: 3 },
        { name: { cn: "黑暗新星", en: "Dark Nova" }, desc: "每隊一名 T 圓形死刑。", solve: "3T 分開、開減傷。", role: "T", danger: 2 },
        { name: { cn: "原子甩尾", en: "Atomic Tail" }, desc: "下層 9999999 即死。", solve: "全員回上層，之後下層會被封。", danger: 3, phase: "P1 結尾" },
        { name: { cn: "天空轨迹", en: "Celestial Trail" }, desc: "北側 8 座塔，每座一人吃 90% 血＋治療降低並擊退；空塔＝全屏＋DOT。第二組 8 座給沒 debuff 的人。", solve: "每塔一人（滿血進），第一輪吃過的不要再進第二輪。", danger: 3, phase: "P2" },
        { name: { cn: "空虚的宣言", en: "Empty Proclamation" }, desc: "全屏 AOE。", solve: "H 補血。", danger: 1, phase: "P2" },
        { name: { cn: "左侧交错剑／右侧交错剑", en: "Left Swordscross / Right Swordscross" }, desc: "兩道超寬直線蓋掉 2/3 場地，安全角落由技能名決定（左侧＝左上角）。", solve: "左侧去左上角、右侧去右上角。", danger: 3, phase: "P2" },
        { name: { cn: "双重吐息", en: "Twin Blaze" }, desc: "兩側各一圓形/月環魔法陣：圓那側放 90° 扇形，月環那側放 90° 弧形（20m 內安全）。", solve: "去月環那側貼王腳下。", danger: 3, phase: "P2" },
        { name: { cn: "灾变之刃", en: "Cataclysmic Blade" }, desc: "灾变涡旋的個人標記＋北側兩道 45° 扇形劍氣。", solve: "先站扇形空隙，再照標記做動作。", danger: 3, phase: "P2" },
        { name: { cn: "磁暴", en: "Burst" }, desc: "兩處由內向外三層圓環（10/20/30m）。", solve: "站兩處之間的縫，或等內圈炸完往內走。", danger: 3, phase: "P2" },
        { name: { cn: "宇宙烈焰", en: "Cosmic Flame" }, desc: "場地左右各兩三條步進圓（王會連線起點）交錯前進。", solve: "站在步進圓的縫隙，等它經過後不動。", danger: 3, phase: "P2" },
        { name: { cn: "原子射线", en: "Atomic Ray" }, desc: "長邊與短邊各一個移動的魔法陣，倒數結束停下放 15m 寬直線。", solve: "倒數快結束時離開兩條線的預測位置。", danger: 3, phase: "P2" },
        { name: { cn: "超新星", en: "Super Nova" }, desc: "點名一人三段分攤。", solve: "全隊集合分攤。", danger: 2, phase: "P2" },
      ],
      tips: ["P1→P2 有不可跳過的過場。P2 場邊沒有洞和傳送陣，注意別掉下去。"],
    },
  ],
  notes: ["掉落：瓦纳·迪尔系列 iL780 裝。尾王箱：迷你普利修、九宫幻卡神龙（瓦纳·迪尔）、演技教材·放声大笑。"],
}
);

</script>
<script>
/* FF14 副本小抄 — 單頁 App，無 build、無框架 */
(function () {
  "use strict";

  const TYPES = [
    ["all", "全部"],
    ["dungeon", "迷宮"],
    ["trial", "討伐"],
    ["extreme", "極"],
    ["raid", "大型"],
    ["savage", "零式"],
    ["alliance", "24人"],
    ["ultimate", "絕"],
  ];
  const TYPE_LABEL = Object.fromEntries(TYPES);
  const EXPS = [
    ["all", "全部"],
    ["arr", "2.x 新生"],
    ["hw", "3.x 蒼天"],
    ["sb", "4.x 紅蓮"],
    ["shb", "5.x 暗影"],
    ["ew", "6.x 曉月"],
    ["dt", "7.x 黃金"],
  ];
  const EXP_LABEL = Object.fromEntries(EXPS);
  const EXP_ORDER = { arr: 0, hw: 1, sb: 2, shb: 3, ew: 4, dt: 5 };
  const TYPE_ORDER = { dungeon: 0, trial: 1, extreme: 2, raid: 3, savage: 4, alliance: 5, ultimate: 6, other: 7 };

  const $ = (s) => document.querySelector(s);
  const els = {
    search: $("#searchInput"), clear: $("#clearBtn"),
    typeChips: $("#typeChips"), expChips: $("#expChips"),
    list: $("#list"), content: $("#content"),
    sidebar: $("#sidebar"), backdrop: $("#backdrop"), menuBtn: $("#menuBtn"),
    compactBtn: $("#compactBtn"), fontPlus: $("#fontPlus"), fontMinus: $("#fontMinus"),
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem("ff14." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("ff14." + k, JSON.stringify(v)); } catch { } },
  };

  const state = {
    data: [], byId: new Map(),
    q: "", type: store.get("type", "all"), exp: store.get("exp", "all"),
    favs: new Set(store.get("favs", [])),
    recent: store.get("recent", []),
    current: null,
    compact: store.get("compact", false),
    fs: store.get("fs", 15),
  };

  /* ---------- 載入資料檔 ---------- */
  function loadData(files) {
    return Promise.all(files.map((f) => new Promise((res) => {
      const s = document.createElement("script");
      s.src = "data/" + f;
      s.onload = () => res(true);
      s.onerror = () => { console.warn("[資料檔未載入]", f); res(false); };
      document.head.appendChild(s);
    })));
  }

  /* ---------- 搜尋 ---------- */
  function norm(s) { return String(s || "").toLowerCase().replace(/[\s\-_'’.:：·・()（）【】\[\]]/g, ""); }
  function buildIndex(d) {
    const parts = [d.name.cn, d.name.tw, d.name.en, ...(d.aliases || [])];
    d._names = parts.filter(Boolean).map(norm);
    d._bossNames = (d.bosses || []).flatMap((b) => [b.name.cn, b.name.en]).filter(Boolean).map(norm);
    d._text = [...d._names, ...d._bossNames].join(" ");
  }
  function score(d, q) {
    if (!q) return 1;
    let best = 0;
    for (const n of d._names) {
      if (n === q) return 100;
      if (n.startsWith(q)) best = Math.max(best, 80);
      else if (n.includes(q)) best = Math.max(best, 60);
    }
    for (const n of d._bossNames) if (n.includes(q)) best = Math.max(best, 40);
    if (!best && d._text.includes(q)) best = 20;
    return best;
  }
  function filtered() {
    const q = norm(state.q);
    return state.data
      .filter((d) => (state.type === "all" || d.type === state.type) && (state.exp === "all" || d.expansion === state.exp))
      .map((d) => ({ d, s: score(d, q) }))
      .filter((x) => x.s > 0)
      .sort((a, b) => q ? (b.s - a.s || cmp(a.d, b.d)) : cmp(a.d, b.d))
      .map((x) => x.d);
  }
  function cmp(a, b) {
    return (EXP_ORDER[a.expansion] - EXP_ORDER[b.expansion])
      || (TYPE_ORDER[a.type] - TYPE_ORDER[b.type])
      || (parseFloat(a.patch) - parseFloat(b.patch))
      || (a.level - b.level)
      || a.name.cn.localeCompare(b.name.cn, "zh");
  }

  /* ---------- 渲染：側欄 ---------- */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (v != null) e.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function fmt(s) {
    // 支援 **粗體** 與換行
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  }

  function renderChips() {
    els.typeChips.replaceChildren(...TYPES.map(([k, l]) =>
      h("button", { class: "chip" + (state.type === k ? " on" : ""), onclick: () => { state.type = k; store.set("type", k); renderChips(); renderList(); } }, l)));
    els.expChips.replaceChildren(...EXPS.map(([k, l]) =>
      h("button", { class: "chip" + (state.exp === k ? " on" : ""), onclick: () => { state.exp = k; store.set("exp", k); renderChips(); renderList(); } }, l)));
  }

  function renderList() {
    const items = filtered();
    const frag = document.createDocumentFragment();
    if (!items.length) {
      frag.append(h("div", { class: "list-empty" }, state.data.length ? "找不到符合的副本" : "尚無資料，請確認 data/ 目錄"));
    } else {
      let lastGroup = null;
      for (const d of items) {
        const g = state.q ? null : d.expansion + "|" + d.type;
        if (g && g !== lastGroup) {
          frag.append(h("div", { class: "list-group" }, `${EXP_LABEL[d.expansion] || d.expansion} · ${TYPE_LABEL[d.type] || d.type}`));
          lastGroup = g;
        }
        frag.append(h("button", {
          class: "list-item" + (state.current && state.current.id === d.id ? " active" : ""),
          "data-id": d.id,
          onclick: () => { location.hash = "#/" + d.id; closeSidebar(); },
        },
          h("span", { class: "lv" }, "Lv" + d.level),
          h("span", { class: "nm" }, d.name.cn, h("small", null, d.name.en)),
          state.favs.has(d.id) ? h("span", { class: "fav" }, "★") : null,
          state.q ? h("span", { class: "badge t-" + d.type }, TYPE_LABEL[d.type] || d.type) : null,
        ));
      }
    }
    els.list.replaceChildren(frag);
    const act = els.list.querySelector(".list-item.active");
    if (act) act.scrollIntoView({ block: "nearest" });
  }

  /* ---------- 渲染：內容 ---------- */
  function renderHome() {
    const link = (d) => h("a", { href: "#/" + d.id }, d.name.cn, h("small", null, `Lv${d.level} ${d.name.en}`));
    const favs = [...state.favs].map((id) => state.byId.get(id)).filter(Boolean).sort(cmp);
    const recent = state.recent.map((id) => state.byId.get(id)).filter(Boolean);
    const counts = {};
    for (const d of state.data) counts[d.type] = (counts[d.type] || 0) + 1;
    els.content.replaceChildren(
      h("div", { class: "home" },
        h("h1", null, "FF14 副本小抄"),
        h("p", null, "進本前打副本名稱搜尋（中文、陸服名、英文、Boss 名都可以），機制怎麼解、要往哪跑，一頁看完。"),
        h("p", null, h("kbd", null, "/"), " 聚焦搜尋 　", h("kbd", null, "Esc"), " 清除 　", h("kbd", null, "Enter"), " 開啟第一個結果 　「精簡」只留機制名＋解法"),
        h("div", { class: "cols" },
          h("div", null, h("h3", null, "★ 我的收藏"), h("div", { class: "linklist" }, favs.length ? favs.map(link) : h("span", { style: "color:var(--fg3)" }, "在副本頁按 ☆ 收藏"))),
          h("div", null, h("h3", null, "最近查看"), h("div", { class: "linklist" }, recent.length ? recent.map(link) : h("span", { style: "color:var(--fg3)" }, "—"))),
        ),
        h("div", { class: "stat" }, `目前收錄 ${state.data.length} 場：` +
          Object.entries(counts).sort((a, b) => TYPE_ORDER[a[0]] - TYPE_ORDER[b[0]]).map(([t, n]) => `${TYPE_LABEL[t] || t} ${n}`).join("、")),
      )
    );
    document.title = "FF14 副本小抄";
  }

  function renderDuty(d) {
    const isFav = state.favs.has(d.id);
    const bossId = (i) => "boss-" + (i + 1);
    els.content.replaceChildren(h("div", { class: "duty" },
      h("div", { class: "duty-head" },
        h("div", { class: "meta" },
          h("span", { class: "badge t-" + d.type }, TYPE_LABEL[d.type] || d.type),
          h("span", null, EXP_LABEL[d.expansion] || d.expansion),
          h("span", null, "Patch " + d.patch),
          h("span", null, "Lv " + d.level + (d.ilvl ? ` · IL ${d.ilvl}` : "")),
        ),
        h("h1", null,
          d.name.cn,
          h("span", { class: "en" }, d.name.en),
          h("button", { class: "iconbtn favbtn" + (isFav ? " on" : ""), title: "收藏", onclick: () => toggleFav(d.id) }, isFav ? "★" : "☆"),
        ),
      ),
      h("div", { class: "overview", html: fmt(d.overview) }),
      d.route ? h("details", { class: "route", open: "" }, h("summary", null, "道中 / 路線提示"), h("div", { class: "body", html: fmt(d.route) })) : null,
      d.bosses.length > 1 ? h("div", { class: "boss-nav" }, d.bosses.map((b, i) => h("a", { href: "#" + bossId(i), onclick: (e) => { e.preventDefault(); document.getElementById(bossId(i))?.scrollIntoView({ behavior: "smooth" }); } }, `${i + 1}. ${b.name.cn}`))) : null,
      d.bosses.map((b, i) => h("section", { class: "boss", id: bossId(i) },
        h("div", { class: "boss-head" },
          h("span", { class: "num" }, "BOSS " + (i + 1)),
          h("h2", null, b.name.cn),
          h("span", { class: "en" }, b.name.en),
        ),
        b.summary ? h("p", { class: "summary", html: fmt(b.summary) }) : null,
        (b.mechanics || []).map((m) => h("div", { class: "mech d" + (m.danger || 0) },
          h("div", { class: "bar" }),
          h("div", null,
            h("div", { class: "mech-title" },
              m.name.cn,
              m.name.en ? h("span", { class: "en" }, m.name.en) : null,
              m.role && m.role !== "all" ? h("span", { class: "role " + m.role }, m.role) : null,
              m.phase ? h("span", { class: "phase" }, m.phase) : null,
            ),
            m.desc ? h("div", { class: "desc", html: fmt(m.desc) }) : null,
            h("div", { class: "solve", html: fmt(m.solve) }),
          ),
        )),
        b.tips && b.tips.length ? h("ul", { class: "tips" }, b.tips.map((t) => h("li", { html: fmt(t) }))) : null,
      )),
      d.notes && d.notes.length ? h("div", { class: "notes" }, h("h3", null, "備註"), h("ul", null, d.notes.map((t) => h("li", { html: fmt(t) })))) : null,
    ));
    document.title = `${d.name.cn} — FF14 副本小抄`;
    window.scrollTo(0, 0);
  }

  function toggleFav(id) {
    if (state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
    store.set("favs", [...state.favs]);
    route();
    renderList();
  }
  function pushRecent(id) {
    state.recent = [id, ...state.recent.filter((x) => x !== id)].slice(0, 12);
    store.set("recent", state.recent);
  }

  /* ---------- 路由 ---------- */
  function route() {
    const m = location.hash.match(/^#\/([\w-]+)/);
    const d = m ? state.byId.get(m[1]) : null;
    state.current = d || null;
    if (d) { renderDuty(d); pushRecent(d.id); } else renderHome();
    els.list.querySelectorAll(".list-item").forEach((el) => el.classList.toggle("active", !!d && el.dataset.id === d.id));
    const act = els.list.querySelector(".list-item.active");
    if (act) act.scrollIntoView({ block: "nearest" });
  }

  /* ---------- UI 事件 ---------- */
  function openSidebar() { els.sidebar.classList.add("open"); els.backdrop.classList.add("show"); }
  function closeSidebar() { els.sidebar.classList.remove("open"); els.backdrop.classList.remove("show"); }
  els.menuBtn.addEventListener("click", () => els.sidebar.classList.contains("open") ? closeSidebar() : openSidebar());
  els.backdrop.addEventListener("click", closeSidebar);

  els.search.addEventListener("input", () => {
    state.q = els.search.value;
    els.clear.hidden = !state.q;
    renderList();
    if (state.q && window.innerWidth <= 860) openSidebar();
  });
  els.search.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const first = filtered()[0];
      if (first) { location.hash = "#/" + first.id; closeSidebar(); els.search.blur(); }
    } else if (e.key === "Escape") { clearSearch(); }
  });
  function clearSearch() { els.search.value = ""; state.q = ""; els.clear.hidden = true; renderList(); }
  els.clear.addEventListener("click", () => { clearSearch(); els.search.focus(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== els.search) { e.preventDefault(); els.search.focus(); els.search.select(); }
  });

  function applyPrefs() {
    document.body.classList.toggle("compact", state.compact);
    els.compactBtn.classList.toggle("on", state.compact);
    document.documentElement.style.setProperty("--fs", state.fs + "px");
  }
  els.compactBtn.addEventListener("click", () => { state.compact = !state.compact; store.set("compact", state.compact); applyPrefs(); });
  els.fontPlus.addEventListener("click", () => { state.fs = Math.min(24, state.fs + 1); store.set("fs", state.fs); applyPrefs(); });
  els.fontMinus.addEventListener("click", () => { state.fs = Math.max(12, state.fs - 1); store.set("fs", state.fs); applyPrefs(); });
  window.addEventListener("hashchange", route);

  /* ---------- 啟動 ---------- */
  applyPrefs();
  renderChips();
  els.content.replaceChildren(h("div", { class: "home" }, h("p", null, "載入資料中…")));
  Promise.resolve().then(() => {
    const seen = new Set();
    for (const d of (window.FF14_DATA || [])) {
      if (!d || !d.id || !d.name || !d.bosses) { console.warn("[資料格式錯誤]", d); continue; }
      if (seen.has(d.id)) { console.warn("[重複 id]", d.id); continue; }
      seen.add(d.id);
      buildIndex(d);
      state.data.push(d);
      state.byId.set(d.id, d);
    }
    state.data.sort(cmp);
    renderList();
    route();
    if (window.innerWidth > 860) els.search.focus();
  });
})();

</script>
</body>
</html>
