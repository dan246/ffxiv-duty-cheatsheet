<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FF14 副本小抄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="iconbtn menu-btn" id="menuBtn" aria-label="開關副本列表"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="brand" href="#/">FF14<span>副本小抄</span></a>
  <div class="search">
    <input id="searchInput" type="search" placeholder="搜尋副本 / Boss（中英皆可，按 / 快速輸入）" autocomplete="off" spellcheck="false">
    <button class="iconbtn clear-btn" id="clearBtn" aria-label="清除" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="topbar-actions">
    <button class="iconbtn" id="fontMinus" title="縮小字體">A−</button>
    <button class="iconbtn" id="fontPlus" title="放大字體">A+</button>
    <button class="iconbtn toggle" id="compactBtn" title="精簡模式：只顯示機制名與解法">精簡</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="filters">
      <div class="chips" id="typeChips"></div>
      <div class="chips" id="expChips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="content" id="content"></main>
</div>

<script src="data/manifest.js"></script>
<script src="js/zh_tw_map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
